<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>⚪ lifeping</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2016%2016'%3E%3Ccircle%20cx%3D'8'%20cy%3D'8'%20r%3D'7'%20fill%3D'%239ca3af'%2F%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="lang" role="group" aria-label="Language / Langue">
      <button type="button" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
      <span aria-hidden="true">|</span>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
    <section id="card" class="card" data-status="loading">
      <div class="indicator" aria-hidden="true">
        <svg class="icon icon-loading" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>
        <svg class="icon icon-unknown" viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4.2 2.75c-.75.33-1.2 1.07-1.2 1.9V14"/><circle cx="12" cy="18" r="1.1"/></svg>
        <svg class="icon icon-green" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <svg class="icon icon-yellow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>
        <svg class="icon icon-red" viewBox="0 0 24 24"><path d="M12 5v9"/><circle cx="12" cy="18.5" r="1.1"/></svg>
      </div>
      <div id="status-live" aria-live="polite" aria-atomic="true">
        <h1 id="headline"></h1>
      </div>
      <p id="last-seen" class="last-seen"></p>
      <p id="last-seen-exact" class="last-seen-exact"></p>
    </section>

    <div id="notice" class="notice" role="status" hidden>
      <svg class="notice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg>
      <span id="notice-text"></span>
    </div>

    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title"></h2>
      <ol id="history-list"></ol>
      <p id="history-empty" class="history-empty" hidden></p>
    </section>
  </main>

  <footer>
    <span id="updated"></span>
  </footer>
</body>
</html>
